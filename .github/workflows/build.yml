name: Portable Windows build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Install and verify the pinned engine
        run: python scripts/setup_ffmpeg.py

      - name: Test source code and GUI
        env:
          IMADEO_REQUIRE_FFMPEG: '1'
        run: python -m pytest -q --junitxml=test-results/tests.xml

      - name: Build portable ZIP and source snapshot
        run: python scripts/build_portable.py

      - name: Verify extracted executable with restricted PATH
        shell: pwsh
        run: |
          $package = Get-ChildItem -LiteralPath dist -Filter '*.zip'
          if (@($package).Count -ne 1) { throw 'Expected exactly one portable ZIP' }
          python scripts/smoke_portable.py $package.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImadeoCovert-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/build-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            test-results/*.xml
            test-results/portable-smoke.json
            build/portable/*/pyinstaller.log
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check tag and corresponding-source material
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release.py --tag $env:RELEASE_TAG --download-sources
      - uses: actions/download-artifact@v4
        with:
          name: ImadeoCovert-windows-x64
          path: dist
      - name: Create draft release for maintainer review
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          files: |
            dist/*.zip
            dist/*.sha256
            release-sources/*
          generate_release_notes: true
